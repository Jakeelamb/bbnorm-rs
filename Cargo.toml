[package]
name = "bbnorm-rs"
version = "0.1.2"
edition = "2024"
description = "Rust implementation of BBTools BBNorm-style read depth normalization"
readme = "README.md"
license = "BSD-3-Clause"
documentation = "https://docs.rs/bbnorm-rs"
keywords = ["bioinformatics", "fastq", "fasta", "normalization", "bbnorm"]
categories = ["command-line-utilities", "science"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/docs/**",
    "/scripts/build_cuda_kmer_reduce_runs.sh",
    "/scripts/cuda_kmer_reduce_runs.cu",
    "/scripts/cuda_kmer_reduce_runs_persistent.cu",
    "/src/**",
    "/tests/basic.rs",
]

[dependencies]
anyhow = "1.0"
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }
gzp = { version = "2.0.2", default-features = false, features = ["deflate_rust"] }
rayon = "1"
rustc-hash = "2.1"
tempfile = "3.10"
